# 접속 실패 원인 진단 — 일회성 도구(workflow_dispatch 전용).
# `TypeError: fetch failed`는 DNS 실패·TCP 거부·TLS 차단·타임아웃을 구분하지 않는다.
# 같은 대상이 로컬에서는 1.4초에 응답하는데 Actions에서만 실패하므로(2026-08-03 대조 실험),
# 어느 계층에서 끊기는지 계층별로 확인한다. 처방은 이 결과 뒤에 정한다.
name: diagnose-network
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. DNS 조회
        run: |
          echo "--- getent hosts ---"
          getent hosts www.courtauction.go.kr || echo "getent 실패(코드 $?)"
          echo "--- dig ---"
          dig +short www.courtauction.go.kr || echo "dig 실패"
          echo "--- 공용 DNS(8.8.8.8) 대조 ---"
          dig +short @8.8.8.8 www.courtauction.go.kr || echo "8.8.8.8 조회 실패"
        continue-on-error: true

      - name: 2. TCP 443 도달성
        run: |
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/www.courtauction.go.kr/443' \
            && echo "TCP 443 연결 성공" \
            || echo "TCP 443 연결 실패(코드 $?)"
        continue-on-error: true

      - name: 3. TLS 핸드셰이크
        run: |
          timeout 20 openssl s_client -connect www.courtauction.go.kr:443 \
            -servername www.courtauction.go.kr </dev/null 2>&1 \
            | head -25 || echo "TLS 실패(코드 $?)"
        continue-on-error: true

      - name: 4. curl 상세(HTTP 응답 코드까지)
        run: |
          curl -sS -o /dev/null -w 'http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
            --max-time 30 -A 'CrazyValueBot/0.1 (+https://github.com/ihaelyong988-lab/crazyvalue)' \
            'https://www.courtauction.go.kr/pgj/index.on' \
            || echo "curl 실패(코드 $?)"
        continue-on-error: true

      - name: 5. IPv6 배제 대조(-4 강제)
        run: |
          curl -4 -sS -o /dev/null -w 'IPv4강제 http=%{http_code} total=%{time_total}s\n' \
            --max-time 30 -A 'CrazyValueBot/0.1 (+https://github.com/ihaelyong988-lab/crazyvalue)' \
            'https://www.courtauction.go.kr/pgj/index.on' \
            || echo "IPv4 강제도 실패(코드 $?)"
        continue-on-error: true

      - name: 6. Node fetch 원인 체인(크롤러와 동일 경로)
        run: |
          node -e "
          fetch('https://www.courtauction.go.kr/pgj/index.on', {
            headers: { 'User-Agent': 'CrazyValueBot/0.1 (+https://github.com/ihaelyong988-lab/crazyvalue)' },
          })
            .then((r) => console.log('node fetch 성공 status=' + r.status))
            .catch((e) => {
              console.log('node fetch 실패:', e.message);
              let c = e.cause;
              while (c) {
                console.log('  cause:', c.code || '', c.message || '', c.errno || '', c.syscall || '');
                c = c.cause;
              }
            });
          "
        continue-on-error: true

      - name: 7. 러너 공인 IP(대역 확인용)
        run: curl -sS --max-time 15 https://api.ipify.org || echo "IP 조회 실패"
        continue-on-error: true
