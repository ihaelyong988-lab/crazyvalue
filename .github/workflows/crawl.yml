# 주간 수집 — 기획안 §8 Phase 3.4 전문.
# 슬롯 2개(1차 1회성 + 정기)로 운용한다. 환산은 각 cron 줄 주석에 병기한다.
name: weekly-crawl
on:
  schedule:
    # 1차 실행 전용(1회성) — UTC 월 18:00 = KST 화 03:00. 대상은 2026-07-28(화) 03:00 KST 뿐이다.
    # 매주 월요일 발화하므로 아래 '실행 슬롯 판정' 게이트가 대상일 외의 발화를 버린다.
    - cron: "0 18 * * 1"
    # 정기 실행 — UTC 토 18:00 = KST 일 03:00(원안 시각).
    - cron: "0 18 * * 6"
  workflow_dispatch:

# 동시 실행 가드(감사 42) — 수동 실행이 정기 실행과 겹치면 같은 파일을 두 job이 쓴다.
# 진행 중 수집은 취소하지 않는다(중단은 곧 그 주 데이터 없음).
concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 수집 상한은 크롤러 쪽 요청 예산(BUDGET.maxRequests=1500)과 상세 단계 마감(90분)이 건다.
    # 따라서 330분은 근거가 없다. 상한을 실제 계약(약 90분) 바로 위로 낮춰 무한 대기 job을 빨리 표면화한다.
    timeout-minutes: 120
    permissions: { contents: write, issues: write }
    steps:
      # 1차 전용 슬롯은 매주 월요일 발화하므로 날짜 게이트로 1회성으로 만든다.
      # 스케줄 지연(직전 실측 53분)이 있어도 KST 날짜는 2026-07-28 이므로 판정은 안전하다.
      # workflow_dispatch 수동 실행은 github.event.schedule 이 빈 값이라 else 분기로 가서 정상 실행된다.
      # 1차 성공 확인 후 `0 18 * * 1` 슬롯과 이 게이트를 제거한다.
      - name: 실행 슬롯 판정
        id: gate
        run: |
          KST_TODAY=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event.schedule }}" = "0 18 * * 1" ] && [ "$KST_TODAY" != "2026-07-28" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "1차 전용 슬롯 — KST $KST_TODAY 은 대상(2026-07-28)이 아니다. 건너뛴다."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "실행 — 슬롯 '${{ github.event.schedule }}' · KST $KST_TODAY"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: 20, cache: npm }
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npm run crawl          # 검증 게이트 실패 시 여기서 중단 → 커밋 없음
        if: steps.gate.outputs.run == 'true'
      - name: commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "crazyvalue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || { git commit -m "data: weekly update $(date -u +%F)"; git push; }
      # 조기 종료 표면화 — 차단·예산 소진·마감은 exit 0(부분 산출·커밋)이라 아래 report failure가
      # 발화하지 않는다. 그대로 두면 전량 역산 이력이 실취득과 같은 화면으로 게시되고 재발을 아무도 모른다.
      - name: report abort
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -e '.aborted == true' public/data/meta.json > /dev/null 2>&1 || exit 0
          REASON=$(jq -r '.abortReason // "미상"' public/data/meta.json)
          AT=$(jq -r '.abortedAtRequest // 0' public/data/meta.json)
          TOTAL=$(jq -r '.totalRequests // 0' public/data/meta.json)
          REAL=$(jq -r '.historySource.real // 0' public/data/meta.json)
          BACK=$(jq -r '.historySource.backcalc // 0' public/data/meta.json)
          {
            echo "주간 수집이 상세 단계에서 조기 종료했다. 물건 데이터는 커밋됐고 기일 이력 정밀도만 낮다."
            echo ""
            echo "- 사유: $REASON"
            echo "- 조기 종료 시점 요청 수: $AT (총 $TOTAL)"
            echo "- 기일 이력: 실취득 $REAL건 · 역산 $BACK건"
            echo "- 실행 로그: $RUN_URL"
            echo ""
            echo "점검: 차단 시점 요청 수를 crawl-config BUDGET.maxRequests와 대조 → 상한 재조정."
          } > crawl-abort.md
          gh issue create --title "주간 수집 조기 종료 $(date -u +%F)" --body-file crawl-abort.md --assignee ihaelyong988-lab
      # 실패 표면화(감사 42) — 침묵 실패 금지(§13 규칙 9). 데이터는 직전 주 상태 그대로다.
      # 건너뛴 슬롯은 실패가 아니므로 이슈를 만들지 않는다.
      # 조건이 `== 'true'`가 아니라 `!= 'false'`인 이유: 게이트 스텝 자신이 실패하면 outputs.run이
      # 빈 문자열이 돼 `== 'true'`가 거짓이 되고, 유일한 실패 알림 채널이 침묵한다. 정상 스킵은
      # run=false로 명시되므로 이 조건에서 계속 제외된다.
      - name: report failure
        if: failure() && steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "weekly-crawl 실행이 실패했다. 데이터는 직전 주 파일이 유지된다(무커밋 계약)."
            echo ""
            echo "실행 로그: $RUN_URL"
            echo "점검: 로그에서 중단 사유 확인 → 로컬 'npm run crawl -- --dry-run --limit 3' 재현 → 수정 후 workflow_dispatch 재실행."
          } > crawl-failure.md
          gh issue create --title "주간 수집 실패 $(date -u +%F)" --body-file crawl-failure.md --assignee ihaelyong988-lab
