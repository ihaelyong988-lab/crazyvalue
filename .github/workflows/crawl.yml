# 주간 수집 — 기획안 §8 Phase 3.4 전문.
# 슬롯 2개(정기 + 자동 캐치업)로 운용한다. **사람이 개입하는 경로는 두지 않는다.**
name: weekly-crawl
on:
  schedule:
    # 정기 — UTC 토 18:00 = KST 일 03:00(원안 시각). 게이트를 무조건 통과한다.
    - cron: "0 18 * * 6"
    # 자동 캐치업 — UTC 일~금 18:00 = KST 월~토 03:00.
    # 데이터가 STALE_DAYS 이상 낡았을 때만 실행한다. GitHub이 정기 슬롯을 드롭했거나
    # 수집이 실패한 주에는 다음 날 03:00부터 매일 스스로 재시도해 갱신을 복구한다.
    # 성공하면 데이터 나이가 0이 되어 다음 정기 슬롯까지 이 슬롯은 조용히 건너뛴다.
    - cron: "0 18 * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "full=주간 전량(약 60분) · quick=리프레쉬 경량(실측 3분)"
        type: choice
        options: [full, quick]
        default: full

# 동시 실행 가드(감사 42) — 수동 실행이 정기 실행과 겹치면 같은 파일을 두 job이 쓴다.
# 진행 중 수집은 취소하지 않는다(중단은 곧 그 주 데이터 없음).
concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 수집 상한은 크롤러 쪽 요청 예산(BUDGET.maxRequests=1500)과 상세 단계 마감(90분)이 건다.
    # 따라서 330분은 근거가 없다. 상한을 실제 계약(약 90분) 바로 위로 낮춰 무한 대기 job을 빨리 표면화한다.
    timeout-minutes: 120
    permissions: { contents: write, issues: write }
    steps:
      # 게이트가 meta.json을 읽어야 하므로 체크아웃을 먼저 한다(건너뛰는 날도 수 초로 끝난다).
      - uses: actions/checkout@v4
      # 실행 여부는 날짜 리터럴이 아니라 **데이터 나이**로 판정한다.
      # 하드코딩한 1회성 날짜는 그 한 번을 놓치면 영구히 복구되지 않아 사람 손을 요구한다
      # (GitHub은 고부하 시 스케줄 이벤트를 지연이 아니라 드롭한다 — 흔적조차 남지 않는다).
      # 나이 기준이면 정기 슬롯이 드롭되거나 수집이 실패해도 다음 날 캐치업이 스스로 이어받는다.
      # 판정 불가(meta 결측·파싱 실패)는 실행하는 쪽으로 기운다 — 침묵 스킵이 최악이다.
      - name: 실행 슬롯 판정
        id: gate
        env:
          # 정기 성공 후 6일째(KST 토 03:00)에 캐치업이 오발화하지 않도록 7일로 둔다.
          STALE_DAYS: "7"
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          KST_TODAY=$(TZ=Asia/Seoul date +%F)
          # checkout은 이벤트 생성 시점 SHA로 고정된다 — concurrency 대기열을 거친 런은
          # 직전 런의 데이터 커밋을 못 보고 옛 meta로 이중 실행한다(실측 2026-07-30, 오탐 이슈 #5).
          # 판정 전 최신 main으로 정렬한다. 실패해도 판정은 계속한다(실행 쪽으로 기우는 기존 원칙).
          git pull --ff-only origin main || true
          CRAWLED=$(jq -r '.crawledAt // empty' public/data/meta.json 2>/dev/null || true)
          CRAWLED_TS=0
          if [ -n "$CRAWLED" ]; then
            CRAWLED_TS=$(date -u -d "$CRAWLED" +%s 2>/dev/null || echo 0)
          fi
          AGE_DAYS=$(( ( $(date -u +%s) - CRAWLED_TS ) / 86400 ))
          echo "KST $KST_TODAY · 슬롯 '${SCHEDULE:-workflow_dispatch}' · 데이터 기준 ${CRAWLED:-없음} · 나이 ${AGE_DAYS}일(하한 ${STALE_DAYS}일)"
          if [ "$SCHEDULE" = "0 18 * * 0-5" ] && [ "$AGE_DAYS" -lt "$STALE_DAYS" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "캐치업 슬롯 — 데이터가 아직 낡지 않았다. 건너뛴다."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "실행한다."
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: 24, cache: npm }
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      # quick = 리프레쉬 경량 모드. 매각기일 창 7일 + 상세 생략으로 요청을 1,030회 → 162회로 줄인다.
      # 실측(2026-08-02): 182초 · 조기 종료 없이 완주 · 산출 1,000건/기일 5일/지역 17개로 전량 모드와 동품질.
      # 전량 모드가 매번 로봇탐지에 걸리는 것과 달리 요청 수가 임계(실측 1,030~2,160)를 크게 밑돈다.
      # 기일 이력은 전량 역산이 된다 — 주간 full 실행이 실취득분을 채운다.
      # 자동 재시도 — 세션 취득이 간헐적으로 실패한다(2026-08-03 실측: 같은 러너에서 10:06·10:22 크롤은
      # 세션을 못 얻었는데 10:33 진단은 DNS·TCP·TLS·curl·Node fetch 전부 200이었다. IP 차단이 아니라
      # 사이트/경로의 일시적 불안정이다). 프로세스 내 백오프(3.7분)를 넘겨도 죽는 경우가 있으므로
      # 워크플로 레벨에서 한 번 더 살린다 — 사람이 다시 누르지 않아도 스스로 복구되어야 한다.
      # 부분 산출(조기 종료)은 exit 0이라 재시도 대상이 아니다. 커밋 없는 완전 실패만 다시 돈다.
      - name: crawl                 # 검증 게이트 실패 시 여기서 중단 → 커밋 없음
        if: steps.gate.outputs.run == 'true'
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
        run: |
          run_crawl() {
            if [ "$MODE" = "quick" ]; then
              npm run crawl -- --window 7 --no-detail
            else
              npm run crawl
            fi
          }
          # quick은 방문자가 기다리는 경로라 2회까지(최대 약 12분), full은 야간 배치라 3회까지.
          [ "$MODE" = "quick" ] && MAX=2 || MAX=3
          for attempt in $(seq 1 "$MAX"); do
            if run_crawl; then
              exit 0
            fi
            if [ "$attempt" -lt "$MAX" ]; then
              echo "수집 ${attempt}회차 실패 — 180초 뒤 재시도한다(총 ${MAX}회)."
              sleep 180
            fi
          done
          echo "수집이 ${MAX}회 모두 실패했다."
          exit 1
      - name: commit data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "crazyvalue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || { git commit -m "data: weekly update $(date -u +%F)"; git push; }
      # 조기 종료 표면화 — 차단·예산 소진·마감은 exit 0(부분 산출·커밋)이라 아래 report failure가
      # 발화하지 않는다. 그대로 두면 전량 역산 이력이 실취득과 같은 화면으로 게시되고 재발을 아무도 모른다.
      - name: report abort
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -e '.aborted == true' public/data/meta.json > /dev/null 2>&1 || exit 0
          REASON=$(jq -r '.abortReason // "미상"' public/data/meta.json)
          AT=$(jq -r '.abortedAtRequest // 0' public/data/meta.json)
          TOTAL=$(jq -r '.totalRequests // 0' public/data/meta.json)
          REAL=$(jq -r '.historySource.real // 0' public/data/meta.json)
          BACK=$(jq -r '.historySource.backcalc // 0' public/data/meta.json)
          {
            echo "주간 수집이 상세 단계에서 조기 종료했다. 물건 데이터는 커밋됐고 기일 이력 정밀도만 낮다."
            echo ""
            echo "- 사유: $REASON"
            echo "- 조기 종료 시점 요청 수: $AT (총 $TOTAL)"
            echo "- 기일 이력: 실취득 $REAL건 · 역산 $BACK건"
            echo "- 실행 로그: $RUN_URL"
            echo ""
            echo "점검: 차단 시점 요청 수를 crawl-config BUDGET.maxRequests와 대조 → 상한 재조정."
          } > crawl-abort.md
          gh issue create --title "주간 수집 조기 종료 $(date -u +%F)" --body-file crawl-abort.md --assignee ihaelyong988-lab
      # 산출물 가치 채점 — "런이 성공했는가"와 "방문자에게 쓸모가 있는가"는 다른 질문이다.
      # 2026-08-02: 산출 1,000건이 전부 하루짜리 기일이고 시도 5곳이 0건이고 이번 주 신규가
      # 0건인데도 크롤·게이트·커밋·배포가 전부 성공이었다 — 성공 신호가 실패를 덮었다.
      # 배포는 막지 않고(강등 철학: 유효 부분집합 상시 배포) 미달 사실만 표면화한다.
      - name: report data value
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if node .claude/hooks/data-value-gate.mjs --check > data-value.txt 2>&1; then
            cat data-value.txt
            exit 0
          fi
          cat data-value.txt
          {
            echo "주간 산출물이 방문자 가치 기준에 미달했다. 데이터는 커밋·배포됐다(부분 배포 계약)."
            echo ""
            echo '```'
            cat data-value.txt
            echo '```'
            echo ""
            echo "실행 로그: $RUN_URL"
            echo ""
            echo "판정 기준 시각은 meta.crawledAt이라 나중에 로컬에서 같은 결과를 재현할 수 있다 —"
            echo "\`node .claude/hooks/data-value-gate.mjs --check\`"
          } > data-value.md
          gh issue create --title "산출물 가치 미달 $(date -u +%F)" --body-file data-value.md --assignee ihaelyong988-lab
      # 실패 표면화(감사 42) — 침묵 실패 금지(§13 규칙 9). 데이터는 직전 주 상태 그대로다.
      # 건너뛴 슬롯은 실패가 아니므로 이슈를 만들지 않는다.
      # 조건이 `== 'true'`가 아니라 `!= 'false'`인 이유: 게이트 스텝 자신이 실패하면 outputs.run이
      # 빈 문자열이 돼 `== 'true'`가 거짓이 되고, 유일한 실패 알림 채널이 침묵한다. 정상 스킵은
      # run=false로 명시되므로 이 조건에서 계속 제외된다.
      - name: report failure
        if: failure() && steps.gate.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "weekly-crawl 실행이 실패했다. 데이터는 직전 주 파일이 유지된다(무커밋 계약)."
            echo ""
            echo "실행 로그: $RUN_URL"
            echo "점검: 로그에서 중단 사유 확인 → 로컬 'npm run crawl -- --dry-run --limit 3' 재현 → 수정 후 workflow_dispatch 재실행."
          } > crawl-failure.md
          gh issue create --title "주간 수집 실패 $(date -u +%F)" --body-file crawl-failure.md --assignee ihaelyong988-lab
