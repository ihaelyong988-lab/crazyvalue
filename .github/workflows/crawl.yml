# 정기 수집 — 기획안 §8 Phase 3.4 전문. **매일 03:00 KST**에 갱신한다(2026-08-05 주인님 확정).
# 슬롯 2개는 "정기 + 조건부 캐치업"이 아니라 **모드 분기**다 — 요일이 실행 여부가 아니라 모드를 가른다.
# 사람이 개입하는 경로는 두지 않는다.
# name(weekly-crawl)은 유지한다 — 워크플로 이름을 바꾸면 등록된 스케줄과 런 이력이 끊긴다.
name: weekly-crawl
on:
  schedule:
    # full — UTC 토 18:00 = KST 일 03:00(원안 시각). 상세까지 전량 수집한다.
    # 요청 수가 로봇탐지 임계(실측 1,030~2,160)에 닿아 매번 조기 종료하므로 주 1회로만 돌린다.
    - cron: "0 18 * * 6"
    # quick — UTC 일~금 18:00 = KST 월~토 03:00. 매각기일 창 7일 + 상세 생략.
    # 실측 3분·요청 162~231회로 임계의 1/5 이하라 매일 돌려도 차단에 닿지 않는다.
    - cron: "0 18 * * 0-5"
    # 지정 시각 = 발화 시각이 아니다 — 정기 슬롯 10회 실측 지연 53~88분(실측 창은 AGENTS §1).
    # GitHub cron의 지연 발화는 플랫폼 정상 동작이라 정시 보장 수단이 없다. 슬롯 값은 그대로 둔다.
  workflow_dispatch:
    inputs:
      mode:
        description: "full=전량(약 60분) · quick=경량(실측 3분)"
        type: choice
        options: [full, quick]
        default: full

# 동시 실행 가드(감사 42) — 수동 실행이 정기 실행과 겹치면 같은 파일을 두 job이 쓴다.
# 진행 중 수집은 취소하지 않는다(중단은 곧 그날 데이터 없음).
concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 시도를 job으로 나눈다(2026-08-11) — **같은 job 안의 재시도는 IP 차단에 무력하다.**
    # 법원 사이트가 러너의 패킷을 버리는데(진단 3회 확증: DNS 정상 · TCP 443 시간초과 ·
    # UND_ERR_CONNECT_TIMEOUT) 러너 공인 IP는 job마다 고정이다. 실측: 한 job에서 10회 재시도가
    # 전부 같은 IP로 죽었고(20:11, IP 20.118.214.18), 8분 뒤 **새 런**이 다른 IP를 받아 즉시 성공했다.
    # matrix는 시도마다 새 러너 = 새 IP를 준다. max-parallel 1로 순차 실행해 사이트에 몰리지 않게 하고,
    # fail-fast false로 앞 시도가 죽어도 뒤 시도가 돈다. 앞 시도가 성공했으면 뒤 시도는 슬롯 판정에서
    # 즉시 건너뛴다(오늘치 데이터가 이미 올라와 있는지로 판정 — 중복 수집 없음).
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3]
    # 수집 상한은 크롤러 쪽 요청 예산(BUDGET.maxRequests=1500)과 상세 단계 마감(90분)이 건다.
    # 따라서 330분은 근거가 없다. 상한을 실제 계약(약 90분) 바로 위로 낮춰 무한 대기 job을 빨리 표면화한다.
    timeout-minutes: 120
    permissions: { contents: write, issues: write }
    env:
      # 자동 알림 이슈에만 붙는 라벨. 중복 억제 조회를 이 라벨로 한정한다.
      # 라벨 없이 제목 접두만으로 억제하면 사람이 연 이슈와 옛 이슈가 억제 계산에 섞여
      # 알림 채널이 통째로 침묵한다 — 2026-08-05 실측: 열린 11건이 3개 접두를 모두 점유해
      # 억제만 넣은 상태에서는 이후 어떤 실패도 이슈를 만들지 못했다(침묵 실패 금지 §13-9 정면 위반).
      ALERT_LABEL: auto-alert
    steps:
      - uses: actions/checkout@v4
      # 슬롯 판정은 이제 실행 여부가 아니라 **모드**만 가른다.
      # 데이터 나이(STALE_DAYS) 조건을 제거했다 — 조건부 캐치업은 정기 슬롯이 성공한 주에
      # 나머지 6일을 통째로 건너뛰어 실질 주 1회였고, 매일 갱신과 양립하지 않는다.
      # run 출력은 유지한다: 뒤 스텝들의 조건이 여기에 걸려 있고, 실패 알림의 fail-safe 조건
      # (`!= 'false'`)도 이 출력을 읽는다.
      - name: 실행 슬롯 판정
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          KST_TODAY=$(TZ=Asia/Seoul date +%F)
          # checkout은 이벤트 생성 시점 SHA로 고정된다 — concurrency 대기열을 거친 런은
          # 직전 런의 데이터 커밋을 못 본 낡은 워킹트리로 시작한다(실측 2026-07-30, 오탐 이슈 #5).
          # 대기열을 거친 런의 워킹트리는 항상 낡았다고 가정하고 최신 main으로 정렬한다.
          # 실패해도 계속한다(실행 쪽으로 기우는 기존 원칙).
          git pull --ff-only origin main || true
          # 스케줄이 없으면 수동 실행이다 — 그때만 입력값을 쓴다.
          if [ -z "$SCHEDULE" ]; then
            MODE="${DISPATCH_MODE:-full}"
          elif [ "$SCHEDULE" = "0 18 * * 6" ]; then
            MODE=full
          else
            MODE=quick
          fi
          CRAWLED=$(jq -r '.crawledAt // empty' public/data/meta.json 2>/dev/null || true)
          echo "KST $KST_TODAY · 슬롯 '${SCHEDULE:-workflow_dispatch}' · 모드 $MODE · ${ATTEMPT}회차 · 직전 수집 ${CRAWLED:-없음}"
          # 2회차 이상은 조건부다 — 새 러너(=새 IP)를 받으려고 나눈 시도이지 매번 다시 긁으려는 게 아니다.
          skip() {
            echo "$1"
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$ATTEMPT" != "1" ]; then
            # 리프레쉬(수동)는 방문자가 화면에서 기다린다 — 안내가 "완료까지 10분 안팎"이라
            # 시도를 늘리면 그 약속이 깨진다. 새 러너 재시도는 정기 슬롯 전용이다.
            [ -z "$SCHEDULE" ] && skip "수동 실행은 1회차로 끝낸다(방문자 대기 시간 보호) — ${ATTEMPT}회차를 건너뛴다."
            # 앞 시도가 이미 오늘치를 올렸으면 끝난 일이다. 위 git pull로 최신 main을 본 상태다.
            [ "${CRAWLED:0:10}" = "$KST_TODAY" ] && skip "앞 시도가 오늘치를 올렸다(${CRAWLED}) — ${ATTEMPT}회차를 건너뛴다."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with: { node-version: 24, cache: npm }
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      # quick = 경량 모드(평일 슬롯과 리프레쉬 공용). 매각기일 창 7일 + 상세 생략으로 요청을 1,030회 → 162회로 줄인다.
      # 실측(2026-08-02): 182초 · 조기 종료 없이 완주 · 산출 1,000건/기일 5일/지역 17개로 전량 모드와 동품질.
      # 전량 모드가 매번 로봇탐지에 걸리는 것과 달리 요청 수가 임계(실측 1,030~2,160)를 크게 밑돈다.
      # 기일 이력은 전량 역산이 된다 — 토요일 full 슬롯이 실취득분을 채운다.
      # 자동 재시도 — 세션 취득이 간헐적으로 실패한다(2026-08-03 실측: 같은 러너에서 10:06·10:22 크롤은
      # 세션을 못 얻었는데 10:33 진단은 DNS·TCP·TLS·curl·Node fetch 전부 200이었다. IP 차단이 아니라
      # 사이트/경로의 일시적 불안정이다). 프로세스 내 백오프(3.7분)를 넘겨도 죽는 경우가 있으므로
      # 워크플로 레벨에서 한 번 더 살린다 — 사람이 다시 누르지 않아도 스스로 복구되어야 한다.
      # 부분 산출(조기 종료)은 exit 0이라 재시도 대상이 아니다. 커밋 없는 완전 실패만 다시 돈다.
      - name: crawl                 # 검증 게이트 실패 시 여기서 중단 → 커밋 없음
        if: steps.gate.outputs.run == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          run_crawl() {
            # --window 7(수집 창)은 crawl-config OUTPUT_WINDOW_DAYS(배분 창)·data-value-gate.mjs
            # (채점 창)와 같은 값이다. 수집 창이 배분 창보다 좁으면 최종 매각기일이 창 끝에 못 미쳐
            # 게이트 R2가 위반으로 잡는다 — 세 값의 정합은 주석이 아니라 기계가 결박한다.
            if [ "$MODE" = "quick" ]; then
              npm run crawl -- --window 7 --no-detail
            else
              npm run crawl
            fi
          }
          # 재시도 창은 횟수가 아니라 **경과 시간**으로 끊는다(2026-08-09). 모드별 소요가 10배
          # 차이라(quick 실측 3분 · full 실측 52분) 횟수로 정하면 full이 job 상한 120분을 넘긴다.
          #   정기 슬롯 — 방문자가 기다리지 않는다. 세션 거부는 간헐적이고 흡수 폭이 문제였다:
          #     08-06·08-08·08-09 3연속 실패가 전부 10분 창 안에서 소진됐다. 창을 50분으로 넓힌다.
          #     full은 1회에 52분이라 첫 시도 뒤 잔여가 없어 자연히 1~2회로 수렴한다(상한 안전).
          #   리프레쉬(workflow_dispatch) — 방문자가 화면에서 기다린다. 창을 넓히면 "눌렀는데 안
          #     끝난다"가 되므로 기존 10분을 유지한다.
          # 창을 짧게 끊는다(2026-08-11 정정) — 이 실패의 주범은 IP 차단이고 **같은 job 안에서는
          # IP가 바뀌지 않으므로** 길게 버티는 것은 순수 낭비다(실측: 창을 50분으로 두고도 10회가
          # 전부 같은 UND_ERR_CONNECT_TIMEOUT으로 죽었다). 짧게 끊고 다음 matrix 시도(=새 러너)로
          # 넘기는 것이 실제 복구 경로다. 진짜 일시적 거부는 이 창 안에서 흡수된다.
          BUDGET_SEC=600
          START=$(date +%s)
          ATTEMPT=1
          if run_crawl; then exit 0; fi
          for WAIT in 300 600 900; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ $((ELAPSED + WAIT)) -ge "$BUDGET_SEC" ]; then
              echo "재시도 창(${BUDGET_SEC}초) 잔여 부족 — 경과 ${ELAPSED}초 · ${ATTEMPT}회 시도에서 멈춘다."
              break
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "수집 실패 — ${WAIT}초 뒤 ${ATTEMPT}회차를 시도한다(경과 ${ELAPSED}초 / 창 ${BUDGET_SEC}초)."
            sleep "$WAIT"
            if run_crawl; then exit 0; fi
          done
          echo "수집이 ${ATTEMPT}회 모두 실패했다."
          exit 1
      - name: commit data
        if: steps.gate.outputs.run == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          git config user.name "crazyvalue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          # 날짜 라벨은 KST로 찍는다(커밋 1곳·이슈 3곳 공통). 슬롯 18:00Z는 KST로 다음 날이라
          # UTC로 찍으면 라벨이 항상 하루 전이다 — 실측: 2026-08-04T19:27Z 런의 게이트 로그가
          # `KST 2026-08-05`인데 커밋 fe29213 제목은 `2026-08-04`였다.
          # 러너(ubuntu)에는 tzdata가 있어 TZ 지정이 그대로 먹는다(같은 로그가 증거다).
          # 게이트의 KST_TODAY를 재사용하지 않는 이유: 스텝마다 셸이 분리되고, 게이트 자신이
          # 죽은 경우 그 출력은 빈 문자열이라 report failure의 제목에서 날짜가 사라진다.
          git diff --cached --quiet || { git commit -m "data: daily update $(TZ=Asia/Seoul date +%F) ($MODE)"; git push; }
      # 배포된 화면 검증(2026-08-09) — 커밋된 파일이 맞는 것과 방문자 화면이 맞는 것은 다른 질문이다.
      # 이 워크플로는 그동안 jq로 파일만 채점하고 배포된 화면을 한 번도 보지 않았다. 그래서 런·게이트·
      # 커밋·배포가 전부 초록인데 주인님 폰은 일주일 묵은 기준일을 띄우고 있었다.
      # 게다가 봇이 GITHUB_TOKEN으로 올린 커밋은 워크플로를 발화시키지 않아(GitHub 사양) CI도 안 돈다 —
      # 08-07 데이터가 E2E 1건을 이틀간 깨뜨린 채였다. 자동화가 만든 변경은 그 자동화가 검사한다.
      # 기준일이 HTML에 구워지므로(src/lib/build-meta.ts) 이 한 스텝이 "배포 반영"과 "화면 정확"을
      # 동시에 판정한다. 배포는 막지 않는다(강등 철학) — 미달 사실만 표면화한다.
      - name: verify deployed screen
        id: screen
        if: success() && steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          # 리프레쉬는 방문자가 화면에서 기다린다 — 안내 문구가 "완료까지 10분 안팎"이라
          # 창을 6분으로 줄여 총 소요를 그 약속 안에 둔다. 정기 슬롯은 기다리는 사람이 없다.
          VERIFY_TIMEOUT_MS: ${{ github.event_name == 'schedule' && '720000' || '360000' }}
        run: |
          # pipefail 필수 — tee가 성공하면 파이프라인 전체가 exit 0이 되어 검증 실패가
          # 통째로 삼켜진다(원장 2026-07-19 동일 함정). 그러면 아래 불일치 알림이 영영 안 뜬다.
          set -o pipefail
          npx tsx scripts/verify-deployed-date.ts 2>&1 | tee screen-verify.txt
      - name: report screen mismatch
        if: success() && steps.screen.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PREFIX="배포 화면 기준일 불일치"
          TITLE="$PREFIX $(TZ=Asia/Seoul date +%F)"
          gh label create "$ALERT_LABEL" --color BFD4F2 --description "워크플로 자동 알림 — 중복 억제 대상" --force >/dev/null 2>&1 || true
          OPEN=$(gh issue list --state open --label "$ALERT_LABEL" --limit 100 --json title 2>/dev/null \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | length' || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "'$TITLE' 이미 열려 있다 — 새로 만들지 않는다."
            exit 0
          fi
          {
            echo "데이터는 커밋·배포됐는데 방문자 화면이 그 기준일을 말하지 않는다."
            echo ""
            echo '```'
            cat screen-verify.txt 2>/dev/null || echo "(검증 출력 없음)"
            echo '```'
            echo ""
            echo "실행 로그: $RUN_URL"
            echo ""
            echo "점검: Vercel 배포가 지연·실패했는가 → 기준일이 빌드 산출물이 아니라 런타임 fetch로"
            echo "되돌아갔는가(AGENTS §9 2026-08-09) 순으로 본다. 로컬 재현은 \`npx tsx scripts/verify-deployed-date.ts\`."
          } > screen-verify.md
          gh issue create --title "$TITLE" --body-file screen-verify.md --assignee ihaelyong988-lab --label "$ALERT_LABEL"
      # 원문 링크 도달 감시 — 목적지는 우리 저장소가 아니라 법원 사이트다. 통보 없이 바뀌고,
      # 바뀌면 아무도 모른다(그 화면 코드에는 2025.12.26 개정 이력이 있다). 2026-08-20까지 전량이
      # 오류창으로 떨어지는 동안 게이트 3종이 초록이었던 이유는 셋 다 자기 자신과 대조했기 때문이다(§9).
      # 여기에 두는 이유: 이 워크플로는 이미 그 사이트에 요청을 보내며, 사이트가 죽으면 수집부터 실패한다.
      # PR마다 외부 사이트를 때리면 CI가 남의 사정으로 빨강이 된다 — 감시는 일일 슬롯의 몫이다.
      # 배포는 막지 않는다(강등 철학) — 계약 위반 사실만 표면화한다.
      - name: verify origin link
        id: origin
        if: success() && steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsx scripts/verify-origin-link.ts 2>&1 | tee origin-verify.txt
      - name: report origin link change
        if: success() && steps.origin.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PREFIX="법원 원문 링크 계약 위반"
          TITLE="$PREFIX $(TZ=Asia/Seoul date +%F)"
          gh label create "$ALERT_LABEL" --color BFD4F2 --description "워크플로 자동 알림 — 중복 억제 대상" --force >/dev/null 2>&1 || true
          OPEN=$(gh issue list --state open --label "$ALERT_LABEL" --limit 100 --json title 2>/dev/null \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | length' || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "'$TITLE' 이미 열려 있다 — 새로 만들지 않는다."
            exit 0
          fi
          {
            echo "상세의 \"법원경매정보에서 사건 조회\"가 도달 계약을 벗어났다 — 방문자가 원문에 닿지 못한다."
            echo ""
            echo '```'
            cat origin-verify.txt 2>/dev/null || echo "(검증 출력 없음)"
            echo '```'
            echo ""
            echo "실행 로그: $RUN_URL"
            echo ""
            echo "점검: 법원이 화면을 옮겼는가(최상단 규격 …F00/…M00) → 검색 폼 필드·번호칸 규격이 바뀌었는가"
            echo "순으로 본다. 규칙과 경위는 AGENTS §2-2 조문 6·§9, docs/CRAWLER.md §4.1."
            echo "로컬 재현은 \`npm run verify:origin\`."
          } > origin-verify.md
          gh issue create --title "$TITLE" --body-file origin-verify.md --assignee ihaelyong988-lab --label "$ALERT_LABEL"
      # 조기 종료 표면화 — 차단·예산 소진·마감은 exit 0(부분 산출·커밋)이라 아래 report failure가
      # 발화하지 않는다. 그대로 두면 전량 역산 이력이 실취득과 같은 화면으로 게시되고 재발을 아무도 모른다.
      # 이슈 4종(조기 종료·가치 미달·화면 불일치·실패) 공통 규약 — 억제 단위는 **접두가 아니라
      # 그날 제목 전체**다(2026-08-09 정정). 접두 억제는 열린 이슈 하나가 이후 모든 알림을 영구히
      # 삼킨다 — 실측: 08-06자 이슈 #17 하나 때문에 08-08·08-09 두 번의 실패가 이슈를 만들지 못했고
      # 주인님은 이틀 동안 수집이 멈춘 사실을 모르셨다. 침묵 실패를 막으려고 넣은 억제가 정확히
      # 침묵 실패를 만들었다(§13 규칙 9 정면 위반). 같은 날 같은 종류만 1건으로 묶는다 — 조건이
      # 지속되면 날마다 1건씩 쌓이는데, 그 쌓임 자체가 "며칠째 실패 중"이라는 신호다.
      # 닫는 자동화는 두지 않는다 — gh issue close는 되돌리기 어렵고 사람이 연 이슈까지 닫는다.
      # 조회가 실패하면 만드는 쪽으로 기운다(알림 경로의 fail-safe = 모르면 알린다, 원장 2026-07-27).
      - name: report abort
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -e '.aborted == true' public/data/meta.json > /dev/null 2>&1 || exit 0
          PREFIX="주간 수집 조기 종료"
          gh label create "$ALERT_LABEL" --color BFD4F2 --description "워크플로 자동 알림 — 중복 억제 대상" --force >/dev/null 2>&1 || true
          TITLE="$PREFIX $(TZ=Asia/Seoul date +%F)"
          OPEN=$(gh issue list --state open --label "$ALERT_LABEL" --limit 100 --json title 2>/dev/null \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | length' || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "'$TITLE' 이미 열려 있다 — 새로 만들지 않는다."
            exit 0
          fi
          REASON=$(jq -r '.abortReason // "미상"' public/data/meta.json)
          AT=$(jq -r '.abortedAtRequest // 0' public/data/meta.json)
          TOTAL=$(jq -r '.totalRequests // 0' public/data/meta.json)
          REAL=$(jq -r '.historySource.real // 0' public/data/meta.json)
          BACK=$(jq -r '.historySource.backcalc // 0' public/data/meta.json)
          {
            echo "수집이 상세 단계에서 조기 종료했다. 물건 데이터는 커밋됐고 기일 이력 정밀도만 낮다."
            echo ""
            echo "- 사유: $REASON"
            echo "- 조기 종료 시점 요청 수: $AT (총 $TOTAL)"
            echo "- 기일 이력: 실취득 $REAL건 · 역산 $BACK건"
            echo "- 실행 로그: $RUN_URL"
            echo ""
            echo "점검: 차단 시점 요청 수를 crawl-config BUDGET.maxRequests와 대조 → 상한 재조정."
          } > crawl-abort.md
          gh issue create --title "$TITLE" --body-file crawl-abort.md --assignee ihaelyong988-lab --label "$ALERT_LABEL"
      # 산출물 가치 채점 — "런이 성공했는가"와 "방문자에게 쓸모가 있는가"는 다른 질문이다.
      # 2026-08-02: 산출 1,000건이 전부 하루짜리 기일이고 시도 5곳이 0건이고 이번 주 신규가
      # 0건인데도 크롤·게이트·커밋·배포가 전부 성공이었다 — 성공 신호가 실패를 덮었다.
      # 배포는 막지 않고(강등 철학: 유효 부분집합 상시 배포) 미달 사실만 표면화한다.
      - name: report data value
        if: success() && steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PREFIX="산출물 가치 미달"
          if node .claude/hooks/data-value-gate.mjs --check > data-value.txt 2>&1; then
            cat data-value.txt
            exit 0
          fi
          cat data-value.txt
          # 중복 억제(이슈 3종 공통 규약)
          gh label create "$ALERT_LABEL" --color BFD4F2 --description "워크플로 자동 알림 — 중복 억제 대상" --force >/dev/null 2>&1 || true
          TITLE="$PREFIX $(TZ=Asia/Seoul date +%F)"
          OPEN=$(gh issue list --state open --label "$ALERT_LABEL" --limit 100 --json title 2>/dev/null \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | length' || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "'$TITLE' 이미 열려 있다 — 새로 만들지 않는다."
            exit 0
          fi
          {
            echo "산출물이 방문자 가치 기준에 미달했다. 데이터는 커밋·배포됐다(부분 배포 계약)."
            echo ""
            echo '```'
            cat data-value.txt
            echo '```'
            echo ""
            echo "실행 로그: $RUN_URL"
            echo ""
            echo "판정 기준 시각은 meta.crawledAt이라 나중에 로컬에서 같은 결과를 재현할 수 있다 —"
            echo "\`node .claude/hooks/data-value-gate.mjs --check\`"
          } > data-value.md
          gh issue create --title "$TITLE" --body-file data-value.md --assignee ihaelyong988-lab --label "$ALERT_LABEL"
      # 실패 원인 계측(2026-08-09) — 08-06·08-08·08-09 세 번의 실패가 전부 `TypeError: fetch failed`
      # 인데 그 껍데기만 로그에 남고 진짜 이유는 기록되지 않아 세 번을 겪고도 원인을 특정하지 못했다.
      # crawl.ts는 이제 err.cause를 편다(describeError). 여기서는 **실패한 그 순간·그 러너에서**
      # 계층별로 찍는다 — 2026-08-03 진단은 실패와 다른 시각(27분 뒤)에 돌아 "전부 정상"이라는
      # 무의미한 결과를 냈다. 계층이 갈리면 원인도 갈린다: 연결 시간초과 = 방화벽이 버림(해외/클라우드
      # IP 차단 가설), 상대가 끊음·DNS 실패 = 사이트 쪽. IPv4/IPv6를 따로 찍는 이유도 같다.
      - name: diagnose network
        if: failure() && steps.gate.outputs.run != 'false'
        continue-on-error: true
        run: |
          set +e
          HOST=www.courtauction.go.kr
          {
            echo "시각: $(TZ=Asia/Seoul date '+%F %T KST')"
            echo "러너 공인 IP: $(curl -4 -s --max-time 10 https://api.ipify.org || echo '조회 실패')"
            echo ""
            echo "[1] DNS"
            getent ahosts "$HOST" 2>&1 | head -8 || echo "  실패"
            echo ""
            echo "[2] TCP 443"
            timeout 12 bash -c "cat < /dev/null > /dev/tcp/$HOST/443" 2>&1 && echo "  연결 성공" || echo "  연결 실패(exit $?) — 방화벽이 버리면 여기서 시간초과한다"
            echo ""
            echo "[3] TLS"
            timeout 15 openssl s_client -connect "$HOST:443" -servername "$HOST" </dev/null 2>&1 \
              | grep -E "^(CONNECTED|depth=0|verify return|SSL handshake)" | head -6 || echo "  실패"
            echo ""
            echo "[4] HTTP curl — IPv4"
            curl -4 -sS -o /dev/null --max-time 25 \
              -w "  code=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n" \
              "https://$HOST/pgj/index.on" 2>&1 || echo "  실패"
            echo "[4] HTTP curl — IPv6"
            curl -6 -sS -o /dev/null --max-time 25 \
              -w "  code=%{http_code} total=%{time_total}s\n" \
              "https://$HOST/pgj/index.on" 2>&1 || echo "  실패(IPv6 미지원 또는 차단)"
            echo ""
            echo "[5] Node fetch — 크롤러와 같은 경로. cause 사슬까지 편다."
            node -e '
              const flat = (e, d = 0) => {
                if (d > 4 || !(e instanceof Error)) return String(e);
                const bits = ["code", "errno", "syscall", "address", "port"]
                  .filter((k) => e[k] !== undefined).map((k) => k + "=" + e[k]).join(" ");
                const head = e.name + ": " + e.message + (bits ? " (" + bits + ")" : "");
                const sub = Array.isArray(e.errors)
                  ? e.errors.map((z) => flat(z, d + 1)).join(" | ")
                  : e.cause !== undefined ? flat(e.cause, d + 1) : "";
                return sub ? head + " <- " + sub : head;
              };
              fetch("https://www.courtauction.go.kr/pgj/index.on", {
                headers: { "User-Agent": "CrazyValueBot/0.1" },
                signal: AbortSignal.timeout(25000),
              }).then((r) => console.log("  성공 status=" + r.status))
                .catch((e) => console.log("  실패 " + flat(e)));
            ' 2>&1 || echo "  node 실행 실패"
          } > network-diag.txt 2>&1
          cat network-diag.txt
      # 실패 표면화(감사 42) — 침묵 실패 금지(§13 규칙 9). 데이터는 직전 파일 그대로다.
      # 조건이 `== 'true'`가 아니라 `!= 'false'`인 이유: 게이트 스텝 자신이 실패하면 outputs.run이
      # 빈 문자열이 돼 `== 'true'`가 거짓이 되고, 유일한 실패 알림 채널이 침묵한다.
      # 게이트가 run=false를 쓰는 경로는 지금 없지만 fail-safe 방향(모르면 알린다)을 유지한다.
      # 마지막 시도에서만 알린다(2026-08-11) — 1회차가 죽고 2회차가 살아난 날에도 알림이 뜨면
      # "실패했다"는 신호가 실제로는 성공한 날에 붙어 신뢰를 잃는다. 앞 시도가 성공하면 뒤 시도는
      # 슬롯 판정에서 run=false로 건너뛰므로 이 조건이 자연히 거짓이 된다. 3회차 job 자체가
      # 게이트 전에 죽으면 run이 빈 문자열이라 `!= 'false'`가 참으로 남는다 — 모르면 알린다.
      #
      # 수동 실행은 예외다(같은 날 실측으로 잡은 구멍) — 리프레쉬는 2·3회차를 설계상 건너뛰므로
      # `attempt == 3`이 **영원히 성립하지 않아** 실패가 통째로 침묵한다. 시도를 나눈 부수효과로
      # 알림 채널 하나를 죽인 것이다(§13 규칙 9 위반). 수동은 1회차가 곧 마지막 시도다.
      - name: report failure
        if: >-
          failure() && steps.gate.outputs.run != 'false'
          && (matrix.attempt == 3 || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PREFIX="주간 수집 실패"
          # 중복 억제(이슈 3종 공통 규약)
          gh label create "$ALERT_LABEL" --color BFD4F2 --description "워크플로 자동 알림 — 중복 억제 대상" --force >/dev/null 2>&1 || true
          TITLE="$PREFIX $(TZ=Asia/Seoul date +%F)"
          OPEN=$(gh issue list --state open --label "$ALERT_LABEL" --limit 100 --json title 2>/dev/null \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | length' || echo 0)
          if [ "${OPEN:-0}" -gt 0 ]; then
            echo "'$TITLE' 이미 열려 있다 — 새로 만들지 않는다."
            exit 0
          fi
          {
            echo "weekly-crawl 실행이 실패했다. 데이터는 직전 실행 파일이 유지된다(무커밋 계약)."
            echo ""
            echo "## 실패 순간의 네트워크 계층 진단"
            echo ""
            echo '```'
            cat network-diag.txt 2>/dev/null || echo "(진단을 수집하지 못했다 — diagnose network 스텝 로그를 보라)"
            echo '```'
            echo ""
            echo "읽는 법 — [2] TCP가 시간초과면 방화벽이 패킷을 버린 것이다(해외·클라우드 IP 차단 가설)."
            echo "[1] DNS 실패나 [5]에서 상대가 끊었다면(ECONNRESET) 사이트 쪽 문제다."
            echo "IPv4는 되는데 IPv6만 실패하면 계열 선택 문제이므로 IPv4 고정으로 해결된다."
            echo ""
            echo "실행 로그: $RUN_URL"
            echo "점검: 위 진단으로 계층을 가른 뒤 → 로컬 'npm run crawl -- --dry-run --limit 3' 재현."
          } > crawl-failure.md
          gh issue create --title "$TITLE" --body-file crawl-failure.md --assignee ihaelyong988-lab --label "$ALERT_LABEL"
