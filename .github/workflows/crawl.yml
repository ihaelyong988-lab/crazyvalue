# 주간 수집 — 기획안 §8 Phase 3.4 전문. cron: UTC 토 18:00 = KST 일요일 03:00(원안 시각).
name: weekly-crawl
on:
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run crawl          # 검증 게이트 실패 시 여기서 중단 → 커밋 없음
      - name: commit data
        run: |
          git config user.name "crazyvalue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || { git commit -m "data: weekly update $(date -u +%F)"; git push; }
